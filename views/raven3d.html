<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>折纸游戏</title>
  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/raven3d.css">
</head>

<body>
  <div id="nav-container"></div>

  <!-- 答题须知页面 -->
  <div id="instructionsPage" class="instructions-page">
    <div class="instructions-container">
      <div class="instructions-content">
        <h2 class="instructions-title">答题须知</h2>
        <div class="instructions-text">
          <p>欢迎同学参加3D推理游戏测试！请仔细阅读以下说明：</p>
          <ul>
            <li>本测试包含多道3D推理题目，每题都有4个选项</li>
            <li>请根据题干中的3D模型，选择最可能正确的推理过程</li>
            <li>一共需要回答每个任务各30道题目，并可以随时跳转到指定题目</li>
            <li>请认真思考每一道题目，确保答案准确</li>
          </ul>
          <p class="instructions-note">请确认您已阅读并理解以上说明，然后输入邀请码点击确认。</p>
        </div>
        <div class="instructions-actions">
          <div class="invite-code-section">
            <label for="inviteCodeInput" class="invite-code-label">邀请码：</label>
            <input type="text" id="inviteCodeInput" class="invite-code-input" placeholder="请输入邀请码">
          </div>
          <button id="confirmBtn" class="confirm-btn" disabled>
            <span id="confirmText">确认 (5)</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 主要内容区域 -->
  <main class="main-content" style="display: none;">
    <div class="test-container">
      <div class="filter-controls">
        <div class="controls-row">
          <div class="version-controls">
            <div class="version-switch">
              <label class="switch-label">难度：</label>
              <select class="version-select" id="difficultySelect">
                <option value="easy" selected>简单 (Easy)</option>
                <option value="hard">困难 (Hard)</option>
              </select>
            </div>
            <div class="version-switch">
              <label class="switch-label">类型：</label>
              <select class="version-select" id="typeSelect">
                <option value="Single" selected>Single</option>
                <option value="Double">Double</option>
                <option value="Triple">Triple</option>
              </select>
            </div>
            <div class="version-switch">
              <label class="switch-label">题目集：</label>
              <select class="version-select" id="taskSelect">
                <!-- 动态生成 -->
              </select>
            </div>
          </div>
          <div class="filter-section" style="display: none;">
             <label class="filter-label">题目筛选：</label>
             <div class="filter-buttons">
               <!-- 隐藏筛选按钮 -->
             </div>
           </div>
           <div class="filter-info">
             <button id="submitBtn" class="nav-btn submit-btn" disabled>
               已答题 0/0
             </button>
           </div>
         </div>
      </div>
      
      <!-- 题目内容 -->
      <div class="question-content split-layout">
        <!-- 左侧：题干区域 -->
        <div class="left-panel">
          <div class="stem-view-container">
            <div id="stemView" class="stem-view"></div>
          </div>
        </div>

        <!-- 右侧：选项区域 -->
        <div class="right-panel">
          <div class="options-grid">
            <div class="option-image-btn" data-option="A"></div>
            <div class="option-image-btn" data-option="B"></div>
            <div class="option-image-btn" data-option="C"></div>
            <div class="option-image-btn" data-option="D"></div>
            <div class="option-image-btn" data-option="E"></div>
            <div class="option-image-btn" data-option="F"></div>
            <div class="option-image-btn" data-option="G"></div>
            <div class="option-image-btn" data-option="H"></div>
          </div>
          
          <!-- 导航控制 -->
          <div class="navigation-controls">
            <button id="prevBtnDesktop" class="nav-btn prev-btn" disabled>
              <i class="bi bi-chevron-left"></i>
              上一题
            </button>
            
            <div class="center-section">
              <div class="progress-info">
                <div class="progress-details">
                  <span>当前：<span id="progressText">0/0</span></span>
                  <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                  </div>
                </div>
                <div class="jump-controls">
                  <input type="number" id="jumpInput" placeholder="题号" min="1" class="jump-input">
                  <button id="jumpBtn" class="jump-btn">跳转</button>
                </div>
              </div>
              <div class="answer-feedback" id="answerFeedback"></div>
            </div>

            <button id="nextBtnDesktop" class="nav-btn next-btn desktop-next-btn">
              下一题
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>


  <!-- 提交确认模态框 -->
  <div class="modal fade" id="submitModal" tabindex="-1" aria-labelledby="submitModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="submitModalLabel">提交答案</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>您已完成所有题目。确认提交并下载答题记录吗？</p>
          <div id="submitStats" class="alert alert-info" style="display:none;">
            <!-- 统计信息将在这里显示 -->
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary" id="confirmSubmitBtn">确认下载</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/firebase-app-compat.js"></script>
  <script src="../js/firebase-auth-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="../js/components-loader-views.js"></script>
  
  <!-- 使用模块化版本 -->
  <script type="module" src="js/raven3d/main.js"></script>
</body>

</html>
